# docker compose -f probe/docker/compose.yaml build
# docker compose -f probe/docker/compose.yaml run --rm probe --client goose --set core
# docker compose -f probe/docker/compose.yaml run --rm conformance --client goose --command "node bridge/host-bridge.mjs goose" --exclude auth/
name: canimcp-probe
services:
  probe:
    image: canimcp-probe:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.174.0-alpha.7}
    # Loopback only: the mock model and fixture server are the only endpoints a client needs.
    network_mode: none
    volumes:
      - ../runs:/canimcp/probe/runs
  # conformance/run.mjs in the same image. The scenario servers listen on loopback beside the client.
  conformance:
    image: canimcp-probe:local
    network_mode: none
    working_dir: /canimcp/probe/conformance
    entrypoint: ["node", "run.mjs"]
    volumes:
      - ../conformance/results:/canimcp/probe/conformance/results
