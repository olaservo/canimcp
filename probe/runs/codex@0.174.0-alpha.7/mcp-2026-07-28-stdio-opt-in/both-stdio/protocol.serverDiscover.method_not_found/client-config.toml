model = "gpt-probe"
model_provider = "probe"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.probe]
name = "probe"
base_url = "http://127.0.0.1:43311/v1"
env_key = "PROBE_API_KEY"
wire_api = "responses"

[mcp_servers.probe]
command = "/usr/local/bin/node"
args = ["/canimcp/probe/dist/server/fixture-server.js", "--fixture", "summary_and_data", "--mode", "raw", "--era", "both", "--capture", "/canimcp/probe/runs/codex@0.174.0-alpha.7/mcp-2026-07-28-stdio-opt-in/both-stdio/protocol.serverDiscover.method_not_found", "--discover-not-found", "--transport", "stdio"]
startup_timeout_sec = 60
tool_timeout_sec = 60

[mcp_servers.probe.env]
CODEX_MCP_PROTOCOL_VERSION = "2026-07-28"

[features]
mcp_2026_07_28 = true
