model = "gpt-probe"
model_provider = "probe"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.probe]
name = "probe"
base_url = "http://127.0.0.1:43041/v1"
env_key = "PROBE_API_KEY"
wire_api = "responses"

[mcp_servers.probe]
command = "/usr/local/bin/node"
args = ["/canimcp/probe/dist/server/fixture-server.js", "--fixture", "audience_user", "--mode", "sdk", "--era", "both", "--capture", "/canimcp/probe/runs/codex@0.174.0-alpha.7/stdio-opt-in-no-flag/both-stdio/tools.result.audience_user", "--transport", "stdio"]
startup_timeout_sec = 60
tool_timeout_sec = 60

[mcp_servers.probe.env]
CODEX_MCP_PROTOCOL_VERSION = "2026-07-28"

