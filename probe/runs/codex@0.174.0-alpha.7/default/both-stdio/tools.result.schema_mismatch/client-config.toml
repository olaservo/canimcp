model = "gpt-probe"
model_provider = "probe"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.probe]
name = "probe"
base_url = "http://127.0.0.1:38365/v1"
env_key = "PROBE_API_KEY"
wire_api = "responses"

[mcp_servers.probe]
command = "/usr/local/bin/node"
args = ["/canimcp/probe/dist/server/fixture-server.js", "--fixture", "schema_mismatch", "--mode", "sdk", "--era", "both", "--capture", "/canimcp/probe/runs/codex@0.174.0-alpha.7/default/both-stdio/tools.result.schema_mismatch", "--transport", "stdio"]
startup_timeout_sec = 60
tool_timeout_sec = 60

